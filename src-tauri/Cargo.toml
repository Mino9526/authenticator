[package]
name = "totp-authenticator"
version = "1.1.2"
description = "Local-first desktop TOTP authenticator with a Rust-backed encrypted vault."
authors = ["Mino9526"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
argon2 = "0.5.3"
base64 = "0.22.1"
chacha20poly1305 = "0.10.1"
hkdf = "0.12.4"
hmac = "0.12.1"
percent-encoding = "2.3.2"
rand_core = { version = "0.6.4", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10.6"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
tauri = { version = "~2.11.0", features = [] }
tauri-plugin-dialog = "~2.7.0"
tauri-plugin-fs = "~2.5.0"
tauri-plugin-opener = "~2.5.0"
url = "2.5.8"
uuid = { version = "1.23.0", features = ["v4"] }
zeroize = "1.8.2"
