[package]
name = "totp-authenticator"
version = "1.0.0"
description = "Desktop TOTP authenticator with Tauri 2 and SQLite persistence."
authors = ["Mino9526"]
edition = "2021"
rust-version = "1.77.2"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
